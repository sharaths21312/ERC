<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<link rel="icon" href="%sveltekit.assets%/favicon.webp" />
		<link rel="stylesheet" href="%sveltekit.assets%/styles.css"/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Energy Recharge Calculator for Genshin Impact" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="dark">
		<script>
			const ua = navigator.userAgent;
			let browserClass = "";
			if (ua.includes("Chrome")) browserClass = "chrome";
			else if (ua.includes("Firefox")) browserClass = "firefox";
			else if (ua.includes("Safari") && !ua.includes("Chrome")) browserClass = "safari";

			document.body.classList.add(browserClass);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
